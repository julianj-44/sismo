<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flujo de la demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Arquitectura · Prueba reproducible</p>
    <h1>Un solo informe, dos bases: la real en vivo y la demo con lotes</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujodemo-title flujodemo-desc">
        <title id="flujodemo-title">Un solo informe, dos bases</title>
        <desc id="flujodemo-desc">El script de R carga el USGS en vivo a la base real o los lotes JSON guardados a la base demo; el mismo informe de Power BI lee la base real y, solo durante la demostración, la base demo.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Etiquetas de carril -->
        <text x="32" y="88" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CARRIL REAL</text>
        <text x="32" y="280" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CARRIL PRUEBA</text>

        <!-- Flechas (antes que las cajas) -->
        <path d="M168,128 H192 Q200,128 200,136 V200 Q200,208 208,208 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M168,320 H192 Q200,320 200,312 V240 Q200,232 208,232 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M168,400 H216 Q224,400 224,392 V264 Q224,256 232,256 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M424,216 H472 Q480,216 480,208 V136 Q480,128 488,128 H536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M424,248 H472 Q480,248 480,256 V352 Q480,360 488,360 H536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M688,128 H732 Q740,128 740,136 V224 Q740,232 748,232 H792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M688,360 H732 Q740,360 740,352 V264 Q740,256 748,256 H792" fill="none" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

        <!-- Etiquetas de flecha -->
        <rect x="210" y="160" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="234" y="171" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EN VIVO</text>
        <rect x="750" y="300" width="64" height="16" rx="2" fill="#f5f5f5"/>
        <text x="782" y="311" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SOLO DEMO</text>

        <!-- USGS -->
        <rect x="32" y="96" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="96" width="136" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="44" y="112" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">FUENTE</text>
        <text x="44" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">USGS</text>
        <text x="44" y="148" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">all_month.geojson</text>

        <!-- inicial.json -->
        <rect x="32" y="288" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="288" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="44" y="304" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ARCHIVO · 1.º</text>
        <text x="44" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">inicial.json</text>
        <text x="44" y="340" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">9.882 eventos</text>

        <!-- reservado.json -->
        <rect x="32" y="368" width="136" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="368" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="44" y="384" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ARCHIVO · 2.º</text>
        <text x="44" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">reservado.json</text>
        <text x="44" y="420" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">20 eventos</text>

        <!-- Script R -->
        <rect x="272" y="184" width="152" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="200" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">PROCESO</text>
        <text x="284" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Script en R</text>
        <text x="284" y="238" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">04_Carga_USGS.R</text>
        <text x="284" y="252" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">cargar()</text>
        <text x="284" y="266" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">cargar('lote.json')</text>

        <!-- Base real -->
        <rect x="536" y="96" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="96" width="152" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="548" y="112" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ALMACÉN</text>
        <text x="548" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Base real</text>
        <text x="548" y="148" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">observatorio_sismico</text>

        <!-- Base demo (focal) -->
        <rect x="536" y="328" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="536" y="328" width="152" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="548" y="344" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ALMACÉN</text>
        <text x="548" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Base demo</text>
        <text x="548" y="380" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">observatorio_demo</text>

        <!-- Informe Power BI (uno solo) -->
        <rect x="792" y="208" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="804" y="224" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">SALIDA</text>
        <text x="804" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Informe Power BI</text>
        <text x="804" y="262" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sismov2.pbip</text>
        <text x="804" y="274" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DirectQuery</text>

        <!-- Notas editoriales -->
        <line x1="32" y1="460" x2="32" y2="500" stroke="#bfc0c0" stroke-width="1.5"/>
        <text x="44" y="474" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Un solo informe, sismov2.pbip: para la demo</text>
        <text x="44" y="494" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">solo se le cambia el origen de datos.</text>

        <line x1="492" y1="460" x2="492" y2="500" stroke="#bf4520" stroke-width="1.5"/>
        <text x="504" y="474" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Power BI nunca lee los JSON: los lee R</text>
        <text x="504" y="494" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">y los escribe en PostgreSQL.</text>

        <!-- Leyenda -->
        <line x1="32" y1="520" x2="928" y2="520" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <rect x="32" y="536" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="56" y="545" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Fuente externa</text>
        <rect x="176" y="536" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="200" y="545" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Archivo guardado</text>
        <rect x="344" y="536" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="368" y="545" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Proceso o informe</text>
        <rect x="512" y="536" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="536" y="545" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Base real</text>
        <rect x="632" y="536" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="656" y="545" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">Base demo (cambio temporal)</text>
      </svg>
    </div>
  </div>
</body>
</html>
